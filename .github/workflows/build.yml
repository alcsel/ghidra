name: Build Extension

# Bu is akisi eklentiyi Ghidra'nin kendi Gradle betigi ile derler.
# - Her push/PR'da derlemenin saglam oldugunu dogrular.
# - 'v*' ile baslayan bir etiket (tag) atildiginda olusan zip'i Release'e ekler.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Ghidra surumunu buradan degistirebilirsiniz.
  GHIDRA_VERSION: '12.1.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ghidra indir
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/NationalSecurityAgency/ghidra/releases?per_page=100"
          url=$(curl -sSL "$api" \
            | grep -oP "\"browser_download_url\":\s*\"\K[^\"]*ghidra_${GHIDRA_VERSION}_PUBLIC[^\"]*\.zip" \
            | head -n1 || true)
          if [ -z "${url:-}" ]; then
            echo "::error::Ghidra ${GHIDRA_VERSION} surumu icin indirme baglantisi bulunamadi."
            echo "Ghidra surumunu '.github/workflows/build.yml' icindeki GHIDRA_VERSION ile guncelleyin."
            exit 1
          fi
          echo "Indiriliyor: $url"
          curl -sSL -o ghidra.zip "$url"
          unzip -q ghidra.zip
          ghidra_dir="$(find . -maxdepth 1 -type d -name "ghidra_${GHIDRA_VERSION}_PUBLIC" | head -n1)"
          echo "GHIDRA_INSTALL_DIR=$PWD/${ghidra_dir#./}" >> "$GITHUB_ENV"

      - name: Eklentiyi derle
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace buildExtension

      - name: Cikti dosyalarini goster
        run: ls -la dist/

      - name: Artefakti yukle
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekAI-ghidra-extension
          path: dist/*.zip
          if-no-files-found: error

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

name: Build Extension

# This workflow builds the extension using Ghidra's official Gradle build script.
# - Validates build integrity on every push and pull request.
# - Publishes the resulting extension zip to GitHub Releases when a 'v*' tag is pushed.

on:
  push:
    branches: [main, master, standalone-extension]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Target Ghidra version
  GHIDRA_VERSION: '12.1.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Ghidra
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/NationalSecurityAgency/ghidra/releases?per_page=100"
          auth_header=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            auth_header=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi
          url=$(curl -sSL "${auth_header[@]}" "$api"             | grep -oP '"browser_download_url":\s*"\K[^"]*ghidra_'${GHIDRA_VERSION}'_PUBLIC[^"]*\.zip'             | head -n1 || true)
          if [ -z "${url:-}" ]; then
            echo "::error::Could not find release download URL for Ghidra ${GHIDRA_VERSION}."
            echo "Please verify the GHIDRA_VERSION in .github/workflows/build.yml."
            exit 1
          fi
          echo "Downloading: $url"
          curl -sSL -o ghidra.zip "$url"
          unzip -q ghidra.zip
          ghidra_dir="$(find . -maxdepth 1 -type d -name "ghidra_${GHIDRA_VERSION}_PUBLIC" | head -n1)"
          echo "GHIDRA_INSTALL_DIR=$PWD/${ghidra_dir#./}" >> "$GITHUB_ENV"

      - name: Build extension
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace buildExtension

      - name: List distribution artifacts
        run: ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekAI-ghidra-extension
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
